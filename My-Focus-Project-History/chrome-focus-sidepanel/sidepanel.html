<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #181818;
      color: #ffffff;
      padding: 12px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h3 { font-size: 15px; color: #0095f6; }

    .file-btn {
      background: #0095f6;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      display: block;
      position: relative;
    }
    .file-btn input[type=file] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    #pdf-viewer {
      width: 100%;
      height: 45%;
      border: 1px solid #333;
      border-radius: 6px;
      background: #2a2a2a;
      display: none;
    }

    #placeholder {
      height: 35%;
      border: 2px dashed #333;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 12px;
      text-align: center;
      padding: 8px;
    }

    textarea {
      flex: 1;
      width: 100%;
      background: #222;
      color: #fff;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.4;
      resize: none;
      outline: none;
    }
    textarea:focus { border-color: #0095f6; }
  </style>
</head>
<body>

  <h3>📚 Study Workspace</h3>

  <label class="file-btn">
    📄 Upload PDF Note
    <input type="file" id="pdf-upload" accept="application/pdf">
  </label>

  <div id="placeholder">Upload a PDF to view notes while chatting</div>
  <iframe id="pdf-viewer"></iframe>

  <textarea id="notes-pad" placeholder="Type quick notes, key formulas, or takeaways here (Auto-saves automatically)..."></textarea>

  <script>
    // Handle PDF File Uploads
    const pdfUpload = document.getElementById('pdf-upload');
    const pdfViewer = document.getElementById('pdf-viewer');
    const placeholder = document.getElementById('placeholder');

    pdfUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && file.type === 'application/pdf') {
        const fileURL = URL.createObjectURL(file);
        pdfViewer.src = fileURL;
        pdfViewer.style.display = 'block';
        placeholder.style.display = 'none';
      }
    });

    // Handle Notes Auto-Save
    const notesPad = document.getElementById('notes-pad');
    
    chrome.storage.local.get(['saved_sidebar_notes'], (result) => {
      if (result.saved_sidebar_notes) notesPad.value = result.saved_sidebar_notes;
    });

    notesPad.addEventListener('input', () => {
      chrome.storage.local.set({ saved_sidebar_notes: notesPad.value });
    });
  </script>
</body>
</html>
