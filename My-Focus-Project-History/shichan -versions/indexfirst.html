<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shin-chan Focus & Study Zone ⚡</title>
  <style>
    /* Shin-chan Theme Palette: Red Shirt (#E63946), Yellow Shorts (#FFD166), Action Blue (#118AB2), Chocobi Green (#06D6A0) */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Fredoka', 'Comfortaa', 'Comic Sans MS', sans-serif;
      background-color: #12131C;
      color: #FFF;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar */
    header {
      background: linear-gradient(135deg, #E63946 0%, #FF2A2A 100%);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(230, 57, 70, 0.4);
      border-bottom: 4px solid #FFD166;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand h1 {
      font-size: 20px;
      font-weight: 800;
      color: #FFD166;
      text-shadow: 2px 2px 0px #000;
      letter-spacing: 0.5px;
    }

    .tagline {
      font-size: 12px;
      background: #FFD166;
      color: #12131C;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    /* Main Container */
    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
      padding: 14px;
      gap: 14px;
    }

    /* Left Panel: Study Zone */
    .study-card {
      flex: 1;
      background: #1D1E2C;
      border: 3px solid #FFD166;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 8px;
    }

    .tab-btn {
      flex: 1;
      background: #2A2C40;
      color: #FFF;
      border: 2px solid #3D405B;
      padding: 10px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      background: #118AB2;
      border-color: #118AB2;
    }

    .tab-btn.active {
      background: #FFD166;
      color: #12131C;
      border-color: #FFD166;
      box-shadow: 0 4px 10px rgba(255, 209, 102, 0.3);
    }

    .tab-content {
      display: none;
      flex: 1;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    .tab-content.active {
      display: flex;
    }

    /* Notes Scratchpad */
    textarea {
      width: 100%;
      height: 100%;
      background: #12131C;
      color: #FFD166;
      border: 2px solid #3D405B;
      border-radius: 10px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.6;
      resize: none;
      outline: none;
      box-sizing: border-box;
    }

    textarea:focus {
      border-color: #06D6A0;
    }

    /* Upload & Video Inputs */
    .btn-action {
      background: #06D6A0;
      color: #12131C;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      text-align: center;
    }

    .btn-action:hover {
      background: #05b88a;
    }

    .file-label input { display: none; }

    #pdf-frame, #yt-frame {
      width: 100%;
      flex: 1;
      border: 2px solid #3D405B;
      border-radius: 10px;
      background: #12131C;
    }

    .yt-box {
      display: flex;
      gap: 8px;
    }

    .yt-box input {
      flex: 1;
      background: #12131C;
      border: 2px solid #3D405B;
      color: #FFF;
      padding: 8px 12px;
      border-radius: 8px;
      outline: none;
    }

    /* Right Panel: Instagram Launcher */
    .chat-card {
      width: 380px;
      background: #1D1E2C;
      border: 3px solid #E63946;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 16px;
    }

    .shinchan-badge {
      width: 100px;
      height: 100px;
      background: #FFD166;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      border: 4px solid #E63946;
      box-shadow: 0 6px 15px rgba(230, 57, 70, 0.3);
    }

    .launch-btn {
      background: linear-gradient(135deg, #118AB2 0%, #06D6A0 100%);
      color: #FFF;
      border: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(17, 138, 178, 0.4);
      transition: transform 0.2s ease;
    }

    .launch-btn:hover {
      transform: scale(1.04);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>⚡ Action Kamen Study Workspace</h1>
      <span class="tagline">Shin-chan Edition</span>
    </div>
    <div style="font-size: 13px; color: #FFF; font-weight: bold;">
      "No Reels Allowed!" 🛑
    </div>
  </header>

  <div class="container">
    <!-- Left Workspace -->
    <div class="study-card">
      <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('notes')">🍫 Chocobi Notes</button>
        <button class="tab-btn" onclick="switchTab('pdf')">📄 PDF Reader</button>
        <button class="tab-btn" onclick="switchTab('yt')">▶️ Action TV (YouTube)</button>
      </div>

      <!-- Tab 1: Notes -->
      <div id="tab-notes" class="tab-content active">
        <textarea id="notes-pad" placeholder="Type your study notes, formulas, or key reminders here... (Auto-saves automatically!)"></textarea>
      </div>

      <!-- Tab 2: PDF -->
      <div id="tab-pdf" class="tab-content">
        <label class="btn-action file-label">
          📂 Choose PDF File from Computer
          <input type="file" id="pdf-input" accept="application/pdf">
        </label>
        <iframe id="pdf-frame"></iframe>
      </div>

      <!-- Tab 3: YouTube -->
      <div id="tab-yt" class="tab-content">
        <div class="yt-box">
          <input type="text" id="yt-url" placeholder="Paste YouTube video URL here...">
          <button class="btn-action" onclick="loadVideo()">Load Video</button>
        </div>
        <iframe id="yt-frame" allowfullscreen></iframe>
      </div>
    </div>

    <!-- Right Side: Instagram Chat Launch -->
    <div class="chat-card">
      <div class="shinchan-badge">🎈</div>
      <h2 style="color: #FFD166;">Instagram Direct</h2>
      <p style="font-size: 13px; color: #A0A5C0; line-height: 1.5;">
        Click below to open Instagram DMs in a dedicated window next to your Shin-chan notes!
      </p>
      <button class="launch-btn" onclick="openInstagramDM()">💬 Open Instagram Chat</button>
    </div>
  </div>

  <script>
    // Tab Switching Logic
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
    }

    // PDF Uploader
    document.getElementById('pdf-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file && file.type === 'application/pdf') {
        const fileURL = URL.createObjectURL(file);
        document.getElementById('pdf-frame').src = fileURL;
      }
    });

    // YouTube Video Embedder
    function loadVideo() {
      const url = document.getElementById('yt-url').value.trim();
      let videoId = '';
      if (url.includes('v=')) {
        videoId = url.split('v=')[1].split('&')[0];
      } else if (url.includes('youtu.be/')) {
        videoId = url.split('youtu.be/')[1].split('?')[0];
      }
      if (videoId) {
        document.getElementById('yt-frame').src = 'https://www.youtube.com/embed/' + videoId;
      }
    }

    // Auto-Save Notes locally
    const notesPad = document.getElementById('notes-pad');
    notesPad.value = localStorage.getItem('shinchan_notes') || '';
    notesPad.addEventListener('input', () => {
      localStorage.setItem('shinchan_notes', notesPad.value);
    });

    // Open Instagram DMs in a side-by-side popup window
    function openInstagramDM() {
      const width = 450;
      const height = window.innerHeight;
      const left = window.innerWidth - width;
      window.open(
        'https://www.instagram.com/direct/inbox/',
        'InstagramDM',
        `width=${width},height=${height},top=0,left=${left},resizable=yes,scrollbars=yes`
      );
    }
  </script>
</body>
</html>
