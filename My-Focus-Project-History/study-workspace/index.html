<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Workspace - Notes & DMs</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #fff;
      overflow: hidden;
    }

    /* Left Side: Notes & PDF Viewer */
    #workspace {
      width: 50%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border-right: 2px solid #262626;
      background: #181818;
    }

    .toolbar {
      padding: 12px 16px;
      background: #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }

    .toolbar h2 { font-size: 16px; font-weight: 600; color: #0095f6; }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }

    .btn {
      background: #0095f6;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    .btn:hover { background: #1877f2; }

    .file-input-wrapper input[type=file] {
      font-size: 100px;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
    }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 12px;
      overflow: hidden;
    }

    #pdf-viewer {
      width: 100%;
      height: 60%;
      border: 1px solid #333;
      border-radius: 8px;
      background: #2a2a2a;
      display: none;
    }

    #placeholder {
      height: 60%;
      border: 2px dashed #333;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 14px;
    }

    textarea {
      width: 100%;
      flex: 1;
      background: #222;
      color: #fff;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      outline: none;
    }
    textarea:focus { border-color: #0095f6; }

    /* Right Side: Instagram Chat */
    #chat-container {
      width: 50%;
      height: 100vh;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Left: Notes & PDF Workspace -->
  <div id="workspace">
    <div class="toolbar">
      <h2>📚 Study Workspace</h2>
      <div class="file-input-wrapper">
        <button class="btn">📄 Upload PDF Note</button>
        <input type="file" id="pdf-upload" accept="application/pdf">
      </div>
    </div>

    <div class="content-area">
      <div id="placeholder">Upload a PDF note above to read while chatting</div>
      <iframe id="pdf-viewer"></iframe>
      
      <textarea id="notes-pad" placeholder="Type quick notes, takeaways, or formulas here (Auto-saves continuously)..."></textarea>
    </div>
  </div>

  <!-- Right: Instagram Direct -->
  <div id="chat-container">
    <iframe id="ig-frame" src="https://www.instagram.com/direct/inbox/"></iframe>
  </div>

  <script>
    // Handle PDF File Uploads
    const pdfUpload = document.getElementById('pdf-upload');
    const pdfViewer = document.getElementById('pdf-viewer');
    const placeholder = document.getElementById('placeholder');

    pdfUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && file.type === 'application/pdf') {
        const fileURL = URL.createObjectURL(file);
        pdfViewer.src = fileURL;
        pdfViewer.style.display = 'block';
        placeholder.style.display = 'none';
      }
    });

    // Handle Notes Auto-Save
    const notesPad = document.getElementById('notes-pad');
    
    // Load previously saved notes
    const savedNotes = localStorage.getItem('user_workspace_notes');
    if (savedNotes) {
      notesPad.value = savedNotes;
    }

    // Save on typing
    notesPad.addEventListener('input', () => {
      localStorage.setItem('user_workspace_notes', notesPad.value);
    });
  </script>
</body>
</html>
